name: Build apps

# Build the Windows .exe and macOS .app automatically.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # pushing a version tag (e.g. v1.0.0) builds + releases
  pull_request:
  # Lets you trigger a build by hand from the Actions tab.
  workflow_dispatch:
  # Also runs if you create a Release through the GitHub web UI.
  release:
    types: [ published ]

# Needed so the workflow can create/update a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PixSwap-Windows
          - os: macos-latest
            artifact: PixSwap-macOS

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean PixSwap.spec

      # --- Windows: zip the one-folder build ---
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PixSwap/* -DestinationPath PixSwap-Windows.zip -Force

      # --- macOS: zip the .app bundle (preserves permissions/symlinks) ---
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # ditto keeps the bundle's symlinks + executable bits intact.
          ditto -c -k --sequesterRsrc --keepParent PixSwap.app ../PixSwap-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      # On a version-tag push OR a published release, attach the zip to a
      # GitHub Release (created automatically if it doesn't exist yet).
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
          # When triggered by a tag push, publish under that tag name.
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
